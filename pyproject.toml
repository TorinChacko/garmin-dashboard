[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-field-log"
version = "0.1.0"
description = "Automated Garmin data ingestion and static fitness analytics dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.6,<0.4",
    "curl-cffi>=0.15,<0.16",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
