name: Fetch Garmin Data

on:
  schedule:
    # Run after the morning Garmin sync (07:00/08:00 Pacific, depending on DST).
    # The old midnight-Pacific run frequently received an all-null daily summary.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

concurrency:
  group: garmin-data-writer
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit data/history.json back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch latest stats
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: python scripts/fetch_garmin_data.py

      - name: Validate data changes
        run: python scripts/validate_garmin_data.py

      - name: Commit updated data
        run: |
          git config user.name "garmin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json docs/data/history.json data/activities.json docs/data/activities.json
          git diff --cached --quiet || git commit -m "Update Garmin data $(date -u +%F)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against the latest main branch."
          done
          exit 1
